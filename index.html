<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habla - Mexican Spanish Coach</title><style>
body{margin:0;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800}.sub,.muted{color:#9aa8bd}.card{background:#121a2b;border:1px solid #26324a;border-radius:20px;padding:20px;margin:12px 0}h1{font-size:30px}button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:14px;background:#3b82f6;color:white;font-size:16px;font-weight:700}button.secondary{background:#202b40}.phrase{font-size:32px;font-weight:800;margin:15px 0}.translation{font-size:18px;color:#d1d9e6}.note{background:#0d1423;padding:14px;border-radius:14px;margin-top:15px;line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1020;padding:10px;display:flex;gap:6px}.nav button{margin:0;background:transparent;color:#9aa8bd}.nav .active{background:#17243b;color:#fff}.bar{height:8px;background:#60a5fa;border-radius:9px}.track{height:8px;background:#253049;border-radius:9px}.choice button{background:#202b40;text-align:left}.score{text-align:center;font-size:48px;font-weight:800}</style></head><body><div class="app" id="app"></div><div class="nav"><button onclick="show('home')">Home</button><button onclick="show('learn')">Learn</button><button onclick="show('speak')">Speak</button><button onclick="show('progress')">Progress</button></div>
<script>
const L=[["Hola","Hello","A universal everyday greeting."],["Buenos días","Good morning","Use this in the morning."],["¿Cómo estás?","How are you?","Informal and very common with people you know."],["Estoy bien","I'm good / I'm fine","Estoy means 'I am' for a current state."],["Gracias","Thank you","Stress the first syllable: GRA-cias."],["¿Y tú?","And you?","Tú is informal 'you' for one person."],["Me llamo Russell","My name is Russell","Literally 'I call myself Russell'; natural for introductions."],["Mucho gusto","Nice to meet you","Common when meeting someone for the first time."]];
let s=JSON.parse(localStorage.getItem("habla")||'{"i":0,"done":0,"spoken":0}');function save(){localStorage.setItem("habla",JSON.stringify(s))}
function show(p){if(p=="home")home();if(p=="learn")learn();if(p=="speak")speakPage();if(p=="progress")prog()}
function say(t){if(!speechSynthesis){alert("Speech is not supported here.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="es-MX";u.rate=.78;let v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang.toLowerCase()=="es-mx")||v.find(x=>x.lang.toLowerCase().startsWith("es"))||null;speechSynthesis.speak(u)}
function home(){app.innerHTML='<div class="top"><div><div class="logo">Habla 🇲🇽</div><div class="sub">Mexican Spanish Coach</div></div><b>A1</b></div><div class="card"><h1>Start speaking Spanish.</h1><p class="muted">Built for someone who can read some Spanish but cannot speak yet. Hear it, understand the grammar, say it, then use it.</p><div class="track"><div class="bar" style="width:'+s.done/L.length*100+'%"></div></div><button onclick="show(\'learn\')">Start today's lesson</button></div><div class="card"><h2>Today's method</h2><p class="muted">Hear → Understand → Speak → Use in conversation.</p></div>'}
function learn(){let x=L[s.i%L.length];app.innerHTML='<div class="top"><div><div class="logo">Lesson '+(s.i%L.length+1)+' / '+L.length+'</div><div class="sub">Mexican Spanish</div></div></div><div class="card"><div class="phrase">'+x[0]+'</div><div class="translation">'+x[1]+'</div><button onclick=\'say('+JSON.stringify(x[0])+')\'>🔊 Hear Mexican Spanish</button><div class="note"><b>Grammar / usage:</b><br>'+x[2]+'</div><button class="secondary" onclick=\'practice('+JSON.stringify(x[0])+')\'>🎤 Say it yourself</button></div><div class="card"><h2>Quick check</h2><p class="muted">What does <b>'+x[0]+'</b> mean?</p><div class="choice"><button onclick="check(this,true)">'+x[1]+'</button><button onclick="check(this,false)">'+(s.i?"See you later":"Good night")+'</button></div></div>'}
function check(b,c){document.querySelectorAll(".choice button").forEach(x=>x.disabled=true);b.style.outline=c?"2px solid #22c55e":"2px solid #ef4444";if(c){s.done=Math.max(s.done,s.i+1);save()}}
function practice(t){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("Speech recognition is not available in this browser. Use the Hear button and repeat aloud.");return}let r=new R();r.lang="es-MX";r.interimResults=false;r.onresult=e=>{let h=e.results[0][0].transcript;s.spoken++;save();alert("I heard: “"+h+"”\n\nKeep practicing!");};r.onerror=()=>alert("I couldn't hear you. Try again somewhere quiet.");r.start()}
function speakPage(){app.innerHTML='<div class="logo">Speak</div><div class="sub">Mini conversation</div><div class="card"><h2>Coach says:</h2><div class="phrase">¿Cómo estás?</div><div class="translation">How are you?</div><button onclick="say(\'¿Cómo estás?\')">🔊 Hear the question</button><button class="secondary" onclick="say(\'Estoy bien, gracias. ¿Y tú?\')">🔊 Hear a natural answer</button><button onclick="practice(\'Estoy bien, gracias. ¿Y tú?\')">🎤 Practice the answer</button></div><div class="card"><h2>Grammar pattern</h2><p class="muted"><b>Estoy + state/feeling</b><br>Estoy bien = I'm good<br>Estoy cansado = I'm tired<br>Estoy listo = I'm ready</p></div>'}
function prog(){app.innerHTML='<div class="logo">Progress</div><div class="sub">Your Spanish journey</div><div class="card"><div class="score">A1</div><p class="muted">Starter foundation</p></div><div class="card"><p class="muted">'+s.done+' of '+L.length+' phrases reviewed</p><p class="muted">'+s.spoken+' speaking practices completed</p></div><button class="secondary" onclick="s={i:0,done:0,spoken:0};save();show(\'home\')">Reset progress</button>'}
show("home");
</script></body></html>
